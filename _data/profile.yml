name: Nikos Giakoumoglou
photo: nikos.jpg

subtitle: 'PhD student at [Imperial College London](https://profiles.imperial.ac.uk/n.giakoumoglou23/about)'

bio: >
  I am a PhD student at [Imperial College London](https://www.imperial.ac.uk/) in the
  Department of Electrical and Electronic Engineering (EEE), within the
  Communications and Signal Processing (CSP) group, supervised by Professor
  [Tania Stathaki](https://profiles.imperial.ac.uk/t.stathaki). Before that, I
  worked as a Research Assistant at the [Information Technologies Institute](https://www.iti.gr/)
  (ITI) of the [Centre for Research and Technology Hellas](https://www.certh.gr/) (CERTH),
  under the supervision of Dr. [Eleftheria-Maria (Ria) Pechlivani](https://www.iti.gr/iti/en/people/eleftheria-maria-pechlivani/)
  and Dr. [Dimitrios Tzovaras](https://www.iti.gr/iti/en/people/dimitrios-tzovaras/).
  I received my Diploma in Electrical and Computer Engineering from Aristotle
  University of Thessaloniki in 2021.

focus: >
  My research focuses on (1) self-supervised learning for vision and vision-language
  models, with a recent emphasis on joint-embedding predictive architectures (JEPAs);
  (2) knowledge distillation; and (3) deep learning for medical imaging.

