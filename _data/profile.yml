name: Nikos Giakoumoglou
photo: nikos.jpg

subtitle: 'Research Postgraduate at [Imperial College London](https://profiles.imperial.ac.uk/n.giakoumoglou23/about)'

bio: >
  I am a PhD student at Imperial College London in the Department of Electrical
  and Electronic Engineering (EEE), within the Communications and Signal
  Processing (CSP) group, supervised by Professor
  [Tania Stathaki](https://profiles.imperial.ac.uk/t.stathaki). Before that, I
  worked as a Research Assistant at the Information Technologies Institute (ITI)
  of the Centre for Research and Technology Hellas (CERTH). I received my Diploma
  in Electrical and Computer Engineering from Aristotle University of
  Thessaloniki in 2021.
  My research focuses on self-supervised learning, in particular joint-embedding predictive
  architectures (JEPAs) for computer vision and vision-language modelling.

