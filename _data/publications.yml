      title={{A Review on Artificial Intelligence Methods for Plant Disease and Pest Detection}},
      author={Giakoumoglou, Nikolaos and Kapetas, Dimitrios and Papadopoulos, Kleanthis Marios and Christakakis, Panagiotis and Stathaki, Tania and Pechlivani, Eleftheria Maria},
      journal={AI and Precision Agriculture},
