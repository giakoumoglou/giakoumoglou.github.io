  title: A Multimodal Approach for Cross-Domain Image Retrieval
  authors: L. Iijima, N. Giakoumoglou and T. Stathaki
  venue: In VISAPP, 2026
  links:
    - {type: scitepress, id: "10.5220/0014460000004084"}
