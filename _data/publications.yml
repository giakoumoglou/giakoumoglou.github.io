- key: giakoumoglou2024synco
  status: review
  year: 2024
  badge: Under Review
  title: "SynCo: Synthetic Hard Negatives for Contrastive Visual Representation Learning"
  authors: N. Giakoumoglou and T. Stathaki
  venue: Under review
  links:
    - {type: arxiv, id: "2410.02401"}
    - {type: code, id: giakoumoglou/synco}
  abstract: >
    Contrastive learning has become a dominant approach in self-supervised visual representation learning, but efficiently leveraging hard negatives, which are samples closely resembling the anchor, remains challenging. We introduce SynCo (Synthetic negatives in Contrastive learning), a novel approach that improves model performance by generating synthetic hard negatives in the representation space. Building on the MoCo framework, SynCo introduces six strategies for creating diverse synthetic hard negatives "on-the-fly" with minimal computational overhead. SynCo achieves faster training and strong representation learning, surpassing MoCo-v2 by +0.4% and MoCHI by +1.0% on ImageNet ILSVRC-2012 linear evaluation. It also transfers more effectively to detection tasks, achieving strong results on PASCAL VOC detection (57.2% AP) and significantly improving over MoCo-v2 on COCO detection (+1.0% AP<sup>bb</sup>) and instance segmentation (+0.8% AP<sup>msk</sup>).
