{%- assign item = include.item -%}

<li class="pub-item">

    <div class="pub-content" style="grid-column: 1 / -1;">

        <div class="pub-title">{{ item.title }}</div>

        {%- if item.detail %}
        <div class="pub-authors">{{ item.detail }}</div>
        {%- endif %}

        {%- if item.description %}
        <div class="pub-authors">{{ item.description }}</div>
        {%- endif %}

        <div class="pub-venue-text">{{ item.date }}</div>

    </div>

</li>
