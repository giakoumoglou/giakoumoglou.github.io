{%- assign profile = site.data.profile -%}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ profile.name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1.9.4/css/academicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<nav class="navbar"><div class="container">
    <a href="/" class="navbar-brand">{{ profile.name }}</a>
    <div class="navbar-right">
        <ul class="navbar-nav">
            <li><a href="/" {% if page.url == "/" %}class="active"{% endif %}>about</a></li>
            <li><a href="/publications/" {% if page.url == "/publications/" %}class="active"{% endif %}>publications</a></li>
            <li><a href="/teaching/" {% if page.url == "/teaching/" %}class="active"{% endif %}>teaching</a></li>
        </ul>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
            <span class="theme-toggle-icon sun-icon"><i class="fa-solid fa-sun"></i></span>
            <span class="theme-toggle-icon moon-icon"><i class="fa-solid fa-moon"></i></span>
        </button>
    </div>
</div></nav>

<div class="container">
{{ content }}
</div>

<footer class="site-footer"><div class="container">&copy; {{ 'now' | date: "%Y" }} Nikolaos Giakoumoglou</div></footer>

<script src="/assets/main.js"></script>
</body>
</html>
